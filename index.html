<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NewVision HUP</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Canvas Confetti for task completion celebration -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            navy: {50:'#f0f4ff',100:'#e0eaff',200:'#c7d7fe',300:'#a5b9fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#3730a3',800:'#1e3a5f',900:'#1a2d4a',950:'#0f172a'}
          }
        }
      }
    }
  </script>
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800">

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<!-- Firebase Compat SDK v10.12.2 for Realtime Firestore & Web Push -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>

<div id="root"></div>

<!-- Main Application Script -->
<script type="text/babel" src="app.js" defer></script>

<script>
  // Fallback helper for local file:// protocol testing
  window.addEventListener('DOMContentLoaded', function() {
    if (window.location.protocol === 'file:') {
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && (!root.children || root.children.length === 0)) {
          root.innerHTML = '<div style="font-family:system-ui,sans-serif;max-width:540px;margin:80px auto;padding:28px;background:#fff;border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,0.08);border:1px solid #fed7aa;text-align:center;">'
            + '<div style="font-size:42px;margin-bottom:12px;">\uD83D\uDCA1</div>'
            + '<h2 style="font-size:19px;font-weight:700;color:#1e293b;margin-bottom:8px;">H\u01B0\u1EDBng d\u1EABn ch\u1EA1y NewVision HUP c\u1EE5c b\u1ED9</h2>'
            + '<p style="font-size:13.5px;color:#475569;line-height:1.6;margin-bottom:14px;">Tr\u00ECnh duy\u1EC7t Chrome/Edge ch\u1EB7n n\u1EA1p file ngo\u00E0i qua <code>file://</code> do ch\u00EDnh s\u00E1ch b\u1EA3o m\u1EADt CORS.</p>'
            + '<div style="background:#fff7ed;padding:12px;border-radius:10px;font-family:monospace;font-size:13px;color:#ea580c;margin-bottom:14px;border:1px dashed #fdba74;">M\u1EDF b\u1EB1ng <b>VS Code Live Server</b> ho\u1EB7c ch\u1EA1y l\u1EC7nh:<br/><b>npx serve</b> (ho\u1EB7c <b>python -m http.server 3000</b>)</div>'
            + '<p style="font-size:12.5px;color:#94a3b8;">Khi \u0111\u01B0a l\u00EAn GitHub Pages, Vercel ho\u1EB7c Firebase Hosting, \u1EE9ng d\u1EE5ng s\u1EBD ch\u1EA1y t\u1EF1 \u0111\u1ED9ng 100% ho\u00E0n h\u1EA3o!</p>'
            + '</div>';
        }
      }, 2500);
    }
  });
</script>
</body>
</html>
